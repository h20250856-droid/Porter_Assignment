<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Porter People Analytics</title>
<style>
:root{color-scheme:light dark;--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e1e0d9;--accent:#1c5cab;--wash:#ecebe6}
@media (prefers-color-scheme:dark){:root{--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#2c2c2a;--accent:#3987e5;--wash:#262624}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:10px 20px;border-bottom:1px solid var(--grid);background:var(--surface)}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--ink2)}
.group{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--wash)}
.group button{border:0;background:transparent;color:var(--ink2);font:inherit;font-weight:600;padding:6px 16px;border-radius:999px;cursor:pointer}
.group button:hover{color:var(--ink)}
.group button[aria-pressed="true"]{background:var(--accent);color:#fff}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-right:6px}
.ctl{display:flex;align-items:center}
.spacer{margin-left:auto}
a.open{color:var(--accent);font-size:13px;text-decoration:none}
a.open:hover{text-decoration:underline}
@media (max-width:600px){header{padding:8px 12px;gap:8px 12px}.brand small,.lbl{display:none}.group button{padding:6px 12px}a.open{margin-left:0}}
iframe{flex:1;width:100%;border:0;background:var(--page)}
</style>
</head>
<body>
<header>
  <div class="brand">Porter · People analytics<small>Hiring and employee sentiment: the story and the dashboard, side by side</small></div>
  <div class="ctl"><span class="lbl">Topic</span><div class="group" id="topic">
    <button data-v="hiring">Hiring</button><button data-v="sentiment">Sentiment</button></div></div>
  <div class="ctl"><span class="lbl">View</span><div class="group" id="view">
    <button data-v="story">Story</button><button data-v="dashboard">Dashboard</button></div></div>
  <a class="open spacer" id="open" target="_blank" rel="noopener">Open full page ↗</a>
</header>
<iframe id="frame" title="Selected report"></iframe>
<script>
(function () {
  var PAGES = {
    "hiring-story": "hiring.html",
    "hiring-dashboard": "hiring_explorer.html",
    "sentiment-story": "sentiment.html",
    "sentiment-dashboard": "sentiment_explorer.html"
  };
  var titles = { "hiring-story": "Hiring: the story", "hiring-dashboard": "Hiring dashboard",
    "sentiment-story": "Sentiment: the story", "sentiment-dashboard": "Sentiment dashboard" };
  var frame = document.getElementById("frame");
  var current = "";

  function parse() {
    var h = location.hash.replace("#", "");
    return PAGES[h] ? h : "hiring-story";
  }
  function show() {
    var key = parse();
    var parts = key.split("-");
    [["topic", parts[0]], ["view", parts[1]]].forEach(function (p) {
      document.querySelectorAll("#" + p[0] + " button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.v === p[1]));
      });
    });
    document.title = titles[key] + " · Porter People Analytics";
    document.getElementById("open").href = PAGES[key];
    if (key !== current) { current = key; frame.src = PAGES[key]; }
  }
  function pick(group, value) {
    var key = parse().split("-");
    if (group === "topic") key[0] = value; else key[1] = value;
    location.hash = key.join("-");
  }
  document.querySelectorAll(".group").forEach(function (g) {
    g.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (b) pick(g.id, b.dataset.v);
    });
  });
  window.addEventListener("hashchange", show);
  show();
})();
</script>
</body>
</html>
